name: Taegliche TikTok-Videos

on:
  schedule:
    - cron: "15 4 * * *"   # 05:15 Uhr deutscher Winterzeit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-videos
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q edge-tts pillow

      - name: Videos rendern
        env:
          VIDEOS_PER_DAY: "2"
          POST_TIMES: "12:30,19:00"
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
        run: |
          echo "RUN_DATE=$(TZ=Europe/Berlin date +%F)" >> "$GITHUB_ENV"
          export RUN_DATE=$(TZ=Europe/Berlin date +%F)
          cd bot && python main.py

      - name: Videos als Release veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="videos-${RUN_DATE}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Videos ${RUN_DATE}" --notes "Automatisch erstellt"
          gh release upload "$TAG" out/*.mp4 --clobber

      - name: Queue und Status speichern
        run: |
          git config user.name "tiktok-bot"
          git config user.email "actions@users.noreply.github.com"
          git add queue data/state.json
          git commit -m "Videos ${RUN_DATE}" || echo "nichts zu committen"
          git pull --rebase -q
          git push
